x-development-image: &development-image
  image: techbyit-smtp-development
  build:
    context: .
    target: development
    args:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}

x-tooling: &tooling
  <<: *development-image
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /var/www/html/wp-content/plugins/techbyit-smtp
  init: true
  environment:
    COMPOSER_HOME: /tmp/composer
    XDG_CACHE_HOME: /tmp/cache
    XDG_DATA_HOME: /tmp/data
    CI: "true"
  volumes:
    - ./:/var/www/html/wp-content/plugins/techbyit-smtp
    - vendor_data:/var/www/html/wp-content/plugins/techbyit-smtp/vendor
    - node_modules_data:/var/www/html/wp-content/plugins/techbyit-smtp/node_modules
    - dist_data:/var/www/html/wp-content/plugins/techbyit-smtp/dist

services:

  setup:
    <<: *tooling
    restart: "no"
    command:
      - sh
      - -euc
      - |
        composer install --no-interaction --prefer-dist
        pnpm install --frozen-lockfile
        pnpm build

  dev:
    <<: *tooling
    command: ["pnpm", "dev"]
    depends_on:
      setup:
        condition: service_completed_successfully

  wordpress:
    <<: *development-image
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wordpress_data:/var/www/html
      - ./:/var/www/html/wp-content/plugins/techbyit-smtp
      - vendor_data:/var/www/html/wp-content/plugins/techbyit-smtp/vendor
      - dist_data:/var/www/html/wp-content/plugins/techbyit-smtp/dist
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy

volumes:
  wordpress_data:
  db_data:
  vendor_data:
  node_modules_data:
  dist_data:
